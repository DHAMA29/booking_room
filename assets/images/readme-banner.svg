<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Gamaspace booking flow</title>
  <desc id="desc">An animated campus facility booking flow connecting users, facilities, and QR check-in.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102a43"/>
      <stop offset="1" stop-color="#0b7285"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".2"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".06"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#061826" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1200" height="260" rx="24" fill="url(#bg)"/>
  <circle cx="1080" cy="-20" r="180" fill="#74c0fc" opacity=".12"/>
  <circle cx="80" cy="270" r="180" fill="#63e6be" opacity=".1"/>
  <path d="M210 130H990" fill="none" stroke="#b2f2bb" stroke-width="3" stroke-dasharray="10 12" opacity=".65"/>
  <g filter="url(#shadow)">
    <rect x="72" y="70" width="210" height="120" rx="18" fill="url(#card)" stroke="#d0ebff" stroke-opacity=".38"/>
    <rect x="495" y="70" width="210" height="120" rx="18" fill="url(#card)" stroke="#d0ebff" stroke-opacity=".38"/>
    <rect x="918" y="70" width="210" height="120" rx="18" fill="url(#card)" stroke="#d0ebff" stroke-opacity=".38"/>
  </g>
  <g fill="none" stroke="#e7f5ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M137 143h80M137 143v27h80v-27M150 143v-25h54v25M163 118v-13h28v13"/>
    <path d="M560 112h80v58h-80zM580 112v-14h40v14M576 132h48M576 146h48"/>
    <path d="M982 111h82v82h-82zM998 127h18v18h-18zM1030 127h18v18h-18zM998 159h18v18h-18zM1030 159h18v18h-18zM1058 127h6"/>
  </g>
  <g fill="#f8f9fa" font-family="Arial, sans-serif" text-anchor="middle">
    <text x="177" y="218" font-size="18" font-weight="700">Pilih ruang</text>
    <text x="600" y="218" font-size="18" font-weight="700">Ajukan booking</text>
    <text x="1023" y="218" font-size="18" font-weight="700">Scan QR</text>
  </g>
  <circle cx="210" cy="130" r="9" fill="#ffd43b">
    <animate attributeName="cx" values="210;990;210" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="r" values="8;12;8" dur="1.2s" repeatCount="indefinite"/>
  </circle>
</svg>
